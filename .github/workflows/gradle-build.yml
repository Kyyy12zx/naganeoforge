name: Gradle build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Report compile classpath
        run: gradle --no-daemon dependencies --configuration compileClasspath

      - name: Inspect resolved animation libraries
        run: |
          find ~/.gradle/caches/modules-2/files-2.1/software.bernie.geckolib -type f -print || true
          find ~/.gradle/caches/modules-2/files-2.1/com.eliotlash.mclib -type f -print || true
          find ~/.gradle/caches/modules-2/files-2.1/software.bernie.geckolib -name '*.jar' -print -exec jar tf {} \; | grep -E 'AnimationController.class|CoreGeoBone.class' || true

      - name: Build NeoForge mod
        run: gradle --no-daemon build
